server:
  model_path: meta-llama/Llama-3.1-8B-Instruct
  draft_model_path: lmsys/sglang-EAGLE3-LLaMA3.1-Instruct-8B
  algorithm: EAGLE3
  dtype: float16
  max_running_requests: 32
  cuda_graph_max_bs: 32
  mem_fraction_static: 0.7
  disable_radix_cache: true
  port: 30001
servers:
- mode: talon
  mu: 0.03
  trees:
  - steps: 9
    topk: 10
    num_draft_tokens: 60
run:
  benches:
  - mt_bench
  - humaneval
  - gsm8k
  - alpaca
  - sum
  - qa
  batch_sizes:
  - 8
  temperatures:
  - 0.0
  subset: all
  limit: 0
  max_turns: 0
  max_new_tokens: 1024
  repeat_prompts_for_batch: {}
  warmup_questions: 4
