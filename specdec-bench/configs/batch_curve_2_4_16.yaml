# Path A: fill in the batch-size curve between the sweep's 1, 8 and 32 (SGLang v0.5.22, H200).
# A subset of configs/sweep_eagle3_llama31.yaml (same server settings and tree names) plus
# TALON-S, at batch sizes 2, 4 and 16: where each shape stops paying off, for a batch-size rule.
server:
  model_path: meta-llama/Llama-3.1-8B-Instruct
  draft_model_path: lmsys/sglang-EAGLE3-LLaMA3.1-Instruct-8B
  algorithm: EAGLE3
  dtype: float16
  max_running_requests: 32
  cuda_graph_max_bs: 32
  mem_fraction_static: 0.80
  disable_radix_cache: true
  port: 30000

servers:
  - mode: ar                 # speedup denominator, same GPU and job
  - mode: adaptive           # SGLang adaptive (chain only), as in the sweep
    adaptive_start: {steps: 3, topk: 1, num_draft_tokens: 4}
  - mode: spec
    trees:
      - {steps: 3, topk: 1, num_draft_tokens: 4, label: chain}     # best at batch 32
      - {steps: 7, topk: 1, num_draft_tokens: 8, label: chain}     # best at batch 1 and 8
      - {steps: 15, topk: 1, num_draft_tokens: 16, label: chain}
      - {steps: 7, topk: 2, num_draft_tokens: 16}                  # one tree per budget
      - {steps: 6, topk: 3, num_draft_tokens: 32}
      - {steps: 8, topk: 4, num_draft_tokens: 60}
      - {steps: 9, topk: 10, num_draft_tokens: 60, label: eagle3_ref}   # EAGLE-3 / TALON-S tree
  - mode: talon              # TALON-S on the same 9 x 10 tree (specdec/sglang_talon_plugin.py)
    mu: 0.03
    trees:
      - {steps: 9, topk: 10, num_draft_tokens: 60}

run:
  benches: [mt_bench, humaneval, gsm8k, alpaca, sum, qa]
  batch_sizes: [2, 4, 16]
  temperatures: [0.0]
  subset: all
  limit: 0
  max_turns: 0
  max_new_tokens: 1024
  repeat_prompts_for_batch: {}
  warmup_questions: 4
