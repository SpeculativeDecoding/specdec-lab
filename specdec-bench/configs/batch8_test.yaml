# EAGLE-3 vs TALON test with batch_size=8
# Run this first to verify everything works before doing the full sweep
#
# Comparison:
#   1. Static EAGLE-3 (K=10, D=8, N=60) - baseline from paper
#   2. TALON-S (N=60, mu=0.03, K=10) - adaptive tree from our implementation
#
# TALON-S is the SGLang variant of TALON with capped tree shapes.
# Full TALON runs via Path B (EAGLE repo, batch 1 only).

server:
  model_path: meta-llama/Llama-3.1-8B-Instruct
  draft_model_path: lmsys/sglang-EAGLE3-LLaMA3.1-Instruct-8B
  algorithm: EAGLE3
  dtype: float16
  max_running_requests: 32
  cuda_graph_max_bs: 32
  mem_fraction_static: 0.80
  disable_radix_cache: true
  port: 30000

servers:
  # Static EAGLE-3 baseline (TALON paper's baseline)
  - mode: spec
    trees:
      - {steps: 9, topk: 10, num_draft_tokens: 60, label: eagle3_s9_k10_b60}

  # TALON-S: Confidence-gated adaptive trees
  # Algorithm 2 from the TALON paper (Liu et al., arXiv 2601.07353)
  # Layer 0: Force top-K (K=10)
  # Layer d>=1: Keep nodes where p(u) >= mu * m_d
  - mode: talon
    talon:
      budget: 60      # N: total verified nodes
      mu: 0.03        # confidence threshold
      root_k: 10      # K: width at layer 0
      num_steps: 9    # tree depth

run:
  benches: [mt_bench, humaneval]
  batch_sizes: [8]  # Single batch size for initial test
  temperatures: [0.0]
  limit: 20         # Test with 20 questions first
  max_turns: 1
  max_new_tokens: 512
  repeat_prompts_for_batch: {}
  warmup_questions: 2
