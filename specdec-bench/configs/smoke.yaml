# Day-1 smoke test: plain decoding vs EAGLE-3 at the EAGLE repo's default tree.
server:
  model_path: meta-llama/Llama-3.1-8B-Instruct
  draft_model_path: lmsys/sglang-EAGLE3-LLaMA3.1-Instruct-8B
  algorithm: EAGLE3
  dtype: float16
  max_running_requests: 8
  cuda_graph_max_bs: 8
  mem_fraction_static: 0.80
  disable_radix_cache: true
  port: 30000
servers:
  - mode: ar
  - mode: spec
    trees:
      - {steps: 6, topk: 10, num_draft_tokens: 60, label: eagle_repo_default}
run:
  benches: [mt_bench, humaneval]
  batch_sizes: [1, 8]
  temperatures: [0.0]
  limit: 10
  max_turns: 1
  max_new_tokens: 512
  repeat_prompts_for_batch: {}
  warmup_questions: 2
