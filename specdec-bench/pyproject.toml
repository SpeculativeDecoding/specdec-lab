[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specdec-bench"
version = "0.1.0"
description = "TALON vs EAGLE-3 speculative decoding benchmark"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Specdec-Bench Contributors"}
]

dependencies = [
    "pyyaml>=6.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.entry-points."sglang.srt.plugins"]
talon = "specdec.sglang_talon_patch:plugin"

[tool.setuptools.packages.find]
where = ["."]
include = ["specdec*"]

[tool.setuptools.package-data]
specdec = ["*.yaml", "*.json"]
